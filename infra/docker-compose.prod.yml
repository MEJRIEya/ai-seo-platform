services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:alpine
    restart: always

  api:
    build: ../backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file: ../.env.prod
    depends_on:
      - db
      - redis
    restart: always

  worker:
    build: ../backend
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    env_file: ../.env.prod
    depends_on:
      - db
      - redis
    restart: always

  beat:
    build: ../backend
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    env_file: ../.env.prod
    depends_on:
      - redis
    restart: always

  frontend:
    build: ../frontend
    env_file: ../.env.prod
    depends_on:
      - api
    restart: always

volumes:
  pgdata: